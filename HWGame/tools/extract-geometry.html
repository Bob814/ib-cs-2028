<!doctype html>
<!-- Used by gen_blank_panel.js: loads index.html (URL after "?") in a 1920×1080 frame and dumps the panel geometry as JSON. -->
<html><head><meta charset="utf-8"><style>body{margin:0}iframe{width:1920px;height:1080px;border:0}</style></head>
<body><pre id="out">pending</pre>
<script>
const f = document.createElement('iframe');
f.src = location.search.slice(1);
f.onload = () => setTimeout(() => {
  try {
    const d = f.contentDocument, st = d.getElementById('stage').getBoundingClientRect();
    const k = st.width / 1920;
    const R = el => { const r = el.getBoundingClientRect(); return [r.left - st.left, r.top - st.top, r.width, r.height].map(v => Math.round(v / k * 10) / 10); };
    const ids = ['chip', 'c-cu', 'c-pc', 'c-ir', 'c-acc', 'c-mar', 'c-mdr', 'c-alu', 'c-ram', 'wheel', 'ramctl', 'head', 'c-in', 'c-out', 'c-storage',
      'v-pc', 'in-pc', 'v-ir', 'cu-dec', 'v-acc', 'n-lamp', 'v-mar', 'v-mdr', 'v-aluA', 'v-aluOp', 'v-aluB', 'v-aluR', 'in-tray', 'out-tray', 'msgpanel', 'topbar'];
    const box = {}; ids.forEach(id => { box[id] = R(d.getElementById(id)); });
    const wheel = box.wheel;
    const cells = [...d.querySelectorAll('#wheel-inner .cell')].map(R).filter(r => r[1] + r[3] > wheel[1] + 1 && r[1] < wheel[1] + wheel[3] - 1);
    const wires = [...d.querySelectorAll('#wires polyline')].map(p => ({ cls: p.getAttribute('class').replace(/\bw\b/, '').trim(), pts: p.getAttribute('points') }));
    const css = getComputedStyle(d.documentElement);
    const col = { addr: css.getPropertyValue('--addr').trim(), data: css.getPropertyValue('--data').trim(), ctrl: css.getPropertyValue('--ctrl').trim() };
    document.getElementById('out').textContent = JSON.stringify({ k, box, cells, wires, col });
  } catch (e) { document.getElementById('out').textContent = 'ERR ' + e; }
}, 800);
document.body.appendChild(f);
</script></body></html>
